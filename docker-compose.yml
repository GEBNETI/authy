services:
  postgres:
    image: postgres:18-alpine
    container_name: authy_postgres
    environment:
      POSTGRES_DB: authy
      POSTGRES_USER: authy_user
      POSTGRES_PASSWORD: authy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authy_user -d authy"]
      interval: 30s
      timeout: 10s
      retries: 3

  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: authy_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  authy:
    build: .
    container_name: authy_api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://authy_user:authy_password@postgres:5432/authy?sslmode=disable
      VALKEY_URL: valkey:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      LOG_LEVEL: info
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authy_frontend
    ports:
      - "3001:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - authy

  prometheus:
    image: prom/prometheus:latest
    container_name: authy_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: authy_grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources

volumes:
  postgres_data:
  valkey_data:
  grafana_data:
